# Its own workspace, outside the root one (see the root pnpm-workspace.yaml),
# so Storybook's dependencies never enter the root install. .pnpmfile.cjs
# reuses the root's stuffbucket/pnpm-hooks policy; after editing either, run
# `pnpm install` here and commit pnpm-lock.yaml with it.
pnpmfile: .pnpmfile.cjs

allowBuilds:
  esbuild: true

overrides:
  # GHSA-g3hv-75wg-m249: only minimatch 11.0.1+ is patched, and glob 13 both
  # depends on minimatch ^10 and inlines a copy into the bundle it exports.
  # The docgen plugin still asks for glob ^13.0.6. Drop this once it moves to
  # glob 14 (same override as maximal's packages/storybook).
  '@joshwooding/vite-plugin-react-docgen-typescript>glob': ^14.0.3
