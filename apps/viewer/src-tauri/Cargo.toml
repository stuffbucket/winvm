[package]
name = "winvm-viewer"
version = "0.1.0"
description = "winvm: Windows 11 ARM64 virtual machines on Apple Silicon"
authors = ["stuffbucket"]
edition = "2021"

[lib]
name = "winvm_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-shell = "=2.3.5"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.3", default-features = false, features = ["json"] }
# reqwest comes with rustls but no crypto provider (the updater's features); agent.rs installs this one, as the updater does.
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSNotification", "NSString", "NSOperation", "block2"] }
block2 = "=0.6.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
