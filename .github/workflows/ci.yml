name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml dispatches this for the release PR, whose GITHUB_TOKEN pushes
  # trigger nothing, with the exact head SHA the checks must cover.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact PR head SHA this run must validate
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

# Read-only for every job (monimal's reasoning: a token that can write is
# handed to every action and `run:` block when this is absent).
permissions:
  contents: read

# GitHub's default shell has -e without -o pipefail, so `cmd | tee log`
# reports tee's success.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: The branch has not moved since dispatch
        if: github.event_name == 'workflow_dispatch' && github.sha != inputs.expected_sha
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          echo "::error::Branch moved before CI dispatch: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history (the repository is small): the commit-subject check
          # reads the pull request's commits. Not `cond && 0 || 1`, which is
          # always 1 because 0 is falsy in expressions.
          fetch-depth: 0

      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      # Bun's version comes from .bun-version, the one Bun pin.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Bun is the pinned version
        run: |
          want=$(tr -d '[:space:]' < .bun-version)
          got=$(bun --version)
          [ "$got" = "$want" ] || { echo "::error::bun $got, .bun-version says $want"; exit 1; }

      # Base and head SHAs, not branch names: checkout fetches the pull
      # request's merge ref, whose parents are these two, and no origin/<base>.
      - name: Commit subjects are Conventional Commits
        if: github.event_name == 'pull_request'
        run: |
          git log --format=%s "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            | bun scripts/check-commit-msg.ts --subjects

      # Before the install: pnpm rejects a recorded shard host before anything
      # else runs (stuffbucket/pnpm-hooks).
      - name: The lockfile records no proxy shard hosts
        run: bun apply-pnpm-tarball-policy.mjs --check

      - name: The Storybook lockfile records no proxy shard hosts
        working-directory: packages/storybook
        run: bun ../../apply-pnpm-tarball-policy.mjs --check

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/storybook/pnpm-lock.yaml') }}
          restore-keys: pnpm-v1-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The signed build refuses a release whose sign_nested list does not match
      # the app's Mach-O files or the builder's policy (v0.1.3), so find out here,
      # while the pull request is open, and not 25 seconds into the release.
      # CI cannot read the builder's private policy, so here only the runtime
      # half runs and the policy half is a maintainer's local run of the same.
      - name: Signing preflight
        run: bun scripts/preflight-signing.ts

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.9.14
          install: false

      - name: Install the pinned static-analysis tools
        run: |
          mise trust mise.toml
          mise trust apps/viewer/mise.toml
          mise trust native/keeper/mise.toml
          mise trust packages/storybook/mise.toml
          mise install
          mise --cd apps/viewer install
          mise --cd native/keeper install
          mise --cd packages/storybook install

      # Storybook's own workspace, into the same store, before the cache is
      # saved so its packages are cached too.
      - name: Install Storybook dependencies
        run: pnpm run storybook:install

      - name: Save pnpm cache
        if: github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      # The fast group of scripts/verify.ts: biome, comments, encoding,
      # shellcheck, shfmt, actionlint, typecheck, types, storybook (story
      # typecheck and tests, contrast audit and knip),
      # typecheck-scripts, boundaries, knip, deps, and cargo fmt, cargo-deny
      # and cargo-machete for the viewer and the keeper. Clippy and cargo test
      # need the macOS target (AppKit, kqueue) and stay local.
      - name: Static gates
        run: pnpm verify --fast

      - name: Typecheck and test
        run: pnpm check
