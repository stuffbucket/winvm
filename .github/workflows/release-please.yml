name: Release Please

# On a push to main: keep the release PR (version bump + CHANGELOG.md) open and
# current. When that PR merges, push the tag vX.Y.Z and dispatch release.yml,
# which owns the GitHub Release (draft, then the .dmg, then one publish).
# GITHUB_TOKEN-created tags and PRs trigger no workflows, so both release.yml
# and CI for the release PR are dispatched explicitly. Adapted from
# stuffbucket/maximal's release-please.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_ci:
        description: Redispatch CI for the current release PR head
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Validate release maintenance ref
        run: bun scripts/release-please-ci.ts validate-trigger

      - name: Tag a merged release PR
        id: tag
        run: |
          version=$(jq -r '.["."]' .release-please-manifest.json)
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null 2>&1; then
            echo "${tag} already tagged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"

      - name: Dispatch release.yml for a tagged, unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null || echo notfound)
          if [ "$draft" = "false" ]; then
            echo "$TAG is published"
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"

      - name: Mark tagged release PRs autorelease:tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --label "autorelease: pending" --json number --jq '.[].number'); do
            gh pr edit "$n" --repo "$GITHUB_REPOSITORY" --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          done

      - name: Capture the current release PR head
        id: release-pr-before
        run: bun scripts/release-please-ci.ts capture

      - name: Open or update the release PR
        env:
          RP_TOKEN: ${{ github.token }}
        run: |
          bunx release-please@17.11.2 release-pr \
            --token "$RP_TOKEN" \
            --repo-url "$GITHUB_REPOSITORY" \
            --target-branch main \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json

      # The release branch ref is authoritative. Dispatch only when Release
      # Please creates or changes it, or when an operator explicitly forces a
      # recovery dispatch, and bind CI to that exact SHA.
      - name: Dispatch CI for a changed release PR head
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ steps.release-pr-before.outputs.sha }}
          FORCE_CI: ${{ inputs.force_ci || false }}
        run: bun scripts/release-please-ci.ts dispatch --before "$BEFORE_SHA" --force "$FORCE_CI"
