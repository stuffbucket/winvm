# Toolchain for winvm. The tool itself runs on Bun; pnpm installs the
# workspace's dependencies.
#
# Bun's version lives in .bun-version (1.4.3), the one Bun pin: mise reads it
# through idiomatic_version_file_enable_tools, and CI reads it with
# setup-bun's bun-version-file. 1.4 rewrote node:http, whose 1.3.x streams
# never notice a client going away (maximal docs/bun-version-policy.md).
# mise.lock pins each tool's artifacts by checksum.
[tools]
pnpm = "12.3.4"

[settings]
idiomatic_version_file_enable_tools = ["bun"]
lockfile = true

# `winvm` (the @winvm/cli bin, linked by pnpm) on PATH inside the repository.
[env]
_.path = ["{{config_root}}/node_modules/.bin"]

# QEMU, swtpm and zstd come from the pinned runtime (packages/core/runtime.json,
# built in stuffbucket/winvm-runtime); `mise install` fetches and verifies it.
[hooks]
postinstall = "bun scripts/check-host.ts || true"
